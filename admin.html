<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Serrana</title><link rel="stylesheet" href="admin.css"></head><body>
<section id="login" class="login"><div class="panel"><p class="eyebrow">SERRANA</p><h1>Painel Administrativo</h1><p>Gerencie fotos e vídeos do portfólio.</p><form id="loginForm"><input id="user" placeholder="Usuário" required><input id="pass" type="password" placeholder="Senha" required><button>Entrar</button><small id="loginMsg"></small></form></div></section>
<section id="app" hidden><header><strong>Serrana — Administração</strong><button id="logout">Sair</button></header><main>
<div class="notice"><b>V3 estática:</b> as mídias são guardadas neste navegador (localStorage). Para publicação em outro dispositivo, exporte o catálogo e importe no navegador do cliente.</div>
<div class="grid"><div class="panel"><h2>Adicionar mídia</h2><label>Tipo<select id="type"><option value="image">Foto</option><option value="video">Vídeo</option></select></label><label>Nome/descrição<input id="title" placeholder="Ex.: Pintura residencial"></label><label>Arquivo<input id="file" type="file" accept="image/*,video/*"></label><label>URL de rede social/vídeo<input id="url" placeholder="YouTube, Vimeo, Instagram ou URL direta"></label><button id="add" class="primary">Adicionar</button><p id="msg"></p></div>
<div class="panel"><h2>Catálogo</h2><div id="list"></div></div></div>
<div class="panel tools"><button id="export">Exportar catálogo</button><label class="import">Importar catálogo<input id="import" type="file" accept=".json"></label><button id="clear" class="danger">Excluir todas</button></div>
</main></section><script src="admin.js"></script></body></html>
